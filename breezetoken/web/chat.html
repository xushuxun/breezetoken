<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>breezetoken chat</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --fg:#e6e6e6; --dim:#8a8f98;
          --user:#2b5cff; --bot:#23262d; --accent:#4ade80; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
         font: 15px/1.6 -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
         height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 16px; background: var(--panel); display: flex;
           align-items: baseline; gap: 10px; border-bottom: 1px solid #000; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .model { color: var(--dim); font-size: 12px; }
  header .stats { margin-left: auto; color: var(--dim); font-size: 12px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex;
         flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px;
         white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); color: #fff;
              border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot);
             border-bottom-left-radius: 4px; }
  .msg.bot.streaming::after { content: "▊"; color: var(--accent);
                              animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  form { display: flex; gap: 8px; padding: 12px 16px;
         background: var(--panel); border-top: 1px solid #000; }
  #in { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #333;
        background: #101216; color: var(--fg); font-size: 15px; outline: none; }
  #in:focus { border-color: var(--user); }
  button { padding: 0 20px; border: 0; border-radius: 8px; background: var(--user);
           color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>breezetoken</h1><span class="model" id="model">…</span>
  <span class="stats" id="stats"></span>
</header>
<div id="log"></div>
<form id="form">
  <input id="in" autocomplete="off" autofocus placeholder="输入消息，Enter 发送">
  <button id="send">发送</button>
</form>
<script>
"use strict";
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("in");
const sendBtn = document.getElementById("send");
const stats = document.getElementById("stats");
let history = [];   // [{role, content}]
let busy = false;

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

fetch("/v1/models").then(r => r.json()).then(d => {
  document.getElementById("model").textContent = d.data[0].id;
}).catch(() => {});

form.onsubmit = async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true;
  input.value = "";
  addMsg("user", text);
  history.push({ role: "user", content: text });
  const bubble = addMsg("bot", "");
  bubble.classList.add("streaming");

  const t0 = performance.now();
  let n = 0;
  try {
    const resp = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: history,
        stream: true,
        max_tokens: 512,
        temperature: 0,
      }),
    });
    if (!resp.ok || !resp.body) throw new Error("HTTP " + resp.status);
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();                     // keep the partial tail
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const data = line.slice(6);
        if (data === "[DONE]") continue;
        const json = JSON.parse(data);
        if (json.error) {
          bubble.textContent += "\n[error: " + json.error.message + "]";
          continue;
        }
        const choice = json.choices && json.choices[0];
        const delta = choice && choice.delta && choice.delta.content;
        if (delta) { bubble.textContent += delta; n++; }
        if (choice && choice.finish_reason) buf = "";
      }
      log.scrollTop = log.scrollHeight;
    }
  } catch (err) {
    bubble.textContent += "\n[error: " + err.message + "]";
  }
  bubble.classList.remove("streaming");
  const dt = (performance.now() - t0) / 1000;
  if (n > 0) stats.textContent = (n / dt).toFixed(1) + " tok/s";
  history.push({ role: "assistant", content: bubble.textContent });
  busy = false; sendBtn.disabled = false;
  input.focus();
};
</script>
</body>
</html>
