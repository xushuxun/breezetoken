[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["breezetoken"]

[project]
name = "breezetoken"
version = "0.1.0"
description = "Fast local llm inference engine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "safetensors>=0.8.0",
    "tilelang>=0.1.15",
    "tokenizers>=0.23.3",
    "torch>=2.14",
]
